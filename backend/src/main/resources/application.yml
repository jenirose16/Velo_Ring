spring:
  application:
    name: veloring-engine
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: veloring-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.veloring.engine.event.TransactionEvent"
    listener:
      ack-mode: manual
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics

veloring:
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: verysecurepassword # In Phase 2, this will be loaded via Spring Profiles/env vars
